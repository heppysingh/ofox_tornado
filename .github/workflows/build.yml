name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch (e.g. 12.1, 11.0, 14.1)'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '14.1'
          - '11.0'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'fox_tornado-eng'
        type: choice
        options:
          - 'fox_tornado-eng'
          - 'orangefox_tornado-eng'
          - 'omni_tornado-eng'
          - 'twrp_tornado-eng'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker system prune -af || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 rsync bc gperf libssl-dev \
            libncurses5-dev libncursesw5-dev \
            lz4 cpio liblzma-dev optipng

      - name: Install repo
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Sources
        run: |
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.tech"
          git config --global color.ui true

          mkdir -p /tmp/sync_tools
          cd /tmp/sync_tools
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH || '12.1' }} --path /tmp/fox

      - name: Copy Device Tree
        run: |
          mkdir -p /tmp/fox/device/xiaomi/tornado
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            ./ /tmp/fox/device/xiaomi/tornado/

      - name: Build OrangeFox Recovery
        run: |
          cd /tmp/fox
          source build/envsetup.sh
          lunch ${{ github.event.inputs.BUILD_TARGET || 'fox_tornado-eng' }}
          mka vendorbootimage || mka recoveryimage || mka bootimage

      - name: Show Build Output
        if: always()
        run: |
          find /tmp/fox/out/target/product/tornado -maxdepth 2 -type f

      - name: Fix Permissions
        if: always()
        run: |
          sudo chown -R runner:runner /tmp/fox/out || true
          sudo chmod -R a+rX /tmp/fox/out || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tornado
          if-no-files-found: warn
          path: |
            /tmp/fox/out/target/product/tornado/OrangeFox*.zip
            /tmp/fox/out/target/product/tornado/OrangeFox*.img
            /tmp/fox/out/target/product/tornado/vendor_boot.img
            /tmp/fox/out/target/product/tornado/vendorboot.img
            /tmp/fox/out/target/product/tornado/vendor_ramdisk_recovery.cpio
            /tmp/fox/out/target/product/tornado/recovery.img
            /tmp/fox/out/target/product/tornado/boot.img
